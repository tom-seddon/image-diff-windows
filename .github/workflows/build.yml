name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test
      - run: dotnet publish src/ImageDiff -c Release -r win-x64 --self-contained false -o publish
      - run: dotnet publish src/ImageDiff.Cli -c Release -r win-x64 --self-contained false -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: ImageDiff-win-x64
          path: publish
